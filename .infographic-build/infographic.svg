      <stop offset="0" stop-color="#0e1424"/>
      <stop offset="0.55" stop-color="#151f38"/>
      <stop offset="1" stop-color="#1c2a4a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
