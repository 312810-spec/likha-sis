<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1F6F5C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>LIKHA-SIS</title>
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Resolve and apply light/dark appearance synchronously before first
      // paint, so a refresh with a dark preference doesn't flash the light
      // UI while React mounts. This mirrors resolveIsDark()/STORAGE_KEY in
      // src/hooks/useDarkMode.js exactly (same storage key, same
      // light/dark/system rule) -- useDarkMode.js stays the runtime
      // authority for theme switching, persistence, and OS-change
      // listening; this script only replays its resolution once, early.
      (function () {
        try {
          var mode = localStorage.getItem("likha-sis-dark-mode");
          var isDark;
          if (mode === "dark") {
            isDark = true;
          } else if (mode === "light") {
            isDark = false;
          } else {
            isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          var root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.style.colorScheme = isDark ? "dark" : "light";
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute("content", isDark ? "dark" : "light");
        } catch (e) {
          // localStorage/matchMedia unavailable -- leave the default
          // "light dark" meta/class alone, same as before this script
          // existed.
        }
      })();
    </script>
    <script>
      // Apply the last-known school brand theme before first paint, so a
      // refresh doesn't flash the default colors while useBrandTheme's
      // Firestore onSnapshot is still resolving. useBrandTheme.js mirrors
      // the resolved CSS vars into this same localStorage key every time
      // the theme is applied; this script only ever replays them.
      (function () {
        try {
          var cached = localStorage.getItem("likha-theme-vars");
          if (!cached) return;
          var vars = JSON.parse(cached);
          var root = document.documentElement.style;
          for (var key in vars) {
            if (Object.prototype.hasOwnProperty.call(vars, key)) {
              root.setProperty(key, vars[key]);
            }
          }
        } catch (e) {
          // Malformed cache or localStorage unavailable -- fall back to
          // the default :root theme, same as before this cache existed.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Register the Service Worker for PWA offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('Service Worker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.error('Service Worker registration failed:', error);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
