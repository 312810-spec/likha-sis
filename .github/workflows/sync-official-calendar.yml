name: Sync Official School Calendar

# Free-tier GitHub Actions replacement for the old scheduled Cloud
# Functions / Cloud Run PAGASA sync (see CLAUDE.md "Free-First Infrastructure
# Mandate" and docs/ai/DECISIONS.md). Two independent jobs, each a short
# Node script under scripts/external-calendar/ -- no build, no deploy, no
# paid service, standard ubuntu-latest runners only.

on:
  schedule:
    # PAGASA advisories: every 2 hours. Deliberately not minute 0 -- GitHub
    # Actions sees heavier load right at common cron boundaries.
    - cron: "17 */2 * * *"
    # DepEd official calendar: once daily.
    - cron: "42 20 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which sync to run"
        type: choice
        options:
          - both
          - pagasa
          - deped
        default: both

permissions:
  contents: read

jobs:
  sync-pagasa:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.target == 'both' || github.event.inputs.target == 'pagasa')) ||
      github.event.schedule == '17 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/external-calendar/package-lock.json

      - name: Install dependencies
        working-directory: scripts/external-calendar
        run: npm ci --no-audit --no-fund

      - name: Sync PAGASA advisories
        working-directory: scripts/external-calendar
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync:pagasa

  sync-deped:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.target == 'both' || github.event.inputs.target == 'deped')) ||
      github.event.schedule == '42 20 * * *'
    runs-on: ubuntu-latest
    # DepEd's own calendar issuance is currently a scanned PDF (no text
    # layer) -- syncDepedCalendar.mjs falls back to OCR (Poppler + Tesseract,
    # both free/open-source, apt-installed below) for that case. A full
    # ~58-page OCR run took ~1 minute locally; this job only runs once a day.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/external-calendar/package-lock.json

      - name: Install OCR toolchain (Poppler + Tesseract)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      - name: Install dependencies
        working-directory: scripts/external-calendar
        run: npm ci --no-audit --no-fund

      - name: Sync DepEd calendar
        working-directory: scripts/external-calendar
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync:deped
